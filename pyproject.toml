[project]
name = "self-healing-browser-agent"
version = "0.1.0"
description = "Claude parses an English description of a browser journey, Playwright drives it, and the agent heals broken selectors at runtime."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Andre Bernal" }]
dependencies = [
    "anthropic>=0.39.0",
    "playwright>=1.47.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
journey-agent = "self_healing_browser_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["self_healing_browser_agent"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
